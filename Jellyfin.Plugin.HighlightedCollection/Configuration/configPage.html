<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Highlighted Collection</title>
</head>
<body>
    <div id="TemplateConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-select,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <form id="TemplateConfigForm">
                    <div class="selectContainer">
                        <label class="selectLabel" for="Collection">Highlighted Collection</label>
                        <select is="emby-select" id="Collection" name="Collection" class="emby-select-withcolor emby-select">
                        </select>
                    </div>
                    <div class="selectContainer">
                        <label class="selectLabel" for="SortOrder">Sort Order</label>
                        <select is="emby-select" id="SortOrder" name="SortOrder" class="emby-select-withcolor emby-select">
                            <option id="optJellyfinDefault" value="JellyfinDefault">Jellyfin default</option>
                            <option id="optDateAddedToCollection" value="DateAddedToCollection">Date added to collection</option>
                            <option id="optName" value="Name">Name (SortName)</option>
                        </select>
                        <div class="fieldDescription">NOTE: "Date added to collection" is tracked from the time the collection is selected here. The "highlighted:" tag can be added manually to media that is missing it.</div>
                    </div>
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <script type="text/javascript">
            var TemplateConfig = {
                pluginUniqueId: '14D6403B-1065-4A19-9363-B258740652C6'
            };

            document.querySelector('#TemplateConfigPage')
                .addEventListener('pageshow', function() {
                    const user = ApiClient.getCurrentUserId();
                    Dashboard.showLoadingMsg();
                    if ($('#Collection option').length == 0) {
                        ApiClient.getItems(user).then(function (data) {
                            let id = data.Items.filter(i => i.Name == "Collections")[0].Id;
                            ApiClient.getItems(user, {ParentId: id}).then(function (collections) {
                                const select = $('#Collection');
                                collections.Items.forEach(function (collection) {
                                    select.append(
                                        $('<option id="opt' + collection.Id + '" value="' + collection.Id + '">' + collection.Name + '</option>')
                                    );
                                });

                                ApiClient.getPluginConfiguration(TemplateConfig.pluginUniqueId).then(function (config) {
                                    document.querySelector('#Collection').value = config.Collection;
                                    document.querySelector('#SortOrder').value = config.SortOrder;
                                    Dashboard.hideLoadingMsg();
                                });
                            });
                        });
                    }
                });

            document.querySelector('#TemplateConfigForm')
                .addEventListener('submit', function(e) {
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(TemplateConfig.pluginUniqueId).then(function (config) {
                    config.Collection = document.querySelector('#Collection').value;
                    config.Title = document.querySelector('#Collection').selectedOptions[0].text;
                    config.SortOrder = document.querySelector('#SortOrder').value;
                    ApiClient.updatePluginConfiguration(TemplateConfig.pluginUniqueId, config).then(function (result) {
                        Dashboard.processPluginConfigurationUpdateResult(result);
                    });
                });

                e.preventDefault();
                return false;
            });
        </script>
    </div>
</body>
</html>
